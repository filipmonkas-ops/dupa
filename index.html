
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dla Weroniki ❤️</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #8b5cf6);
    overflow-x: hidden;
}

.card {
    width: 90%;
    max-width: 500px;
    padding: 30px 20px;
    border-radius: 30px;
    background: rgba(255,255,255,0.18);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    position: relative;
    z-index: 2;
}

.photo {
    width: 170px;
    height: 170px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid white;
}

h1 { font-size: 38px; }
h2 { font-size: 25px; }

p { font-size: 18px; line-height: 1.5; }

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 25px 0;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#yes { background: white; color: #e83e70; }
#no { background: #222; color: white; position: relative; }

#result {
    font-size: 23px;
    font-weight: bold;
}

.heart {
    position: fixed;
    bottom: -50px;
    pointer-events: none;
    animation: fly 5s linear forwards;
}

@keyframes fly {
    to {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>
<body>

<div class="card">
    <img src="weronika.jpg" class="photo" alt="Weronika">

    <h1>Lubię Cię Weronika ❤️</h1>
    <h2>Pysiu Mysiu 🐭💕</h2>

    <p>
        To jest oficjalny komunikat! 😎<br><br>
        Po przeprowadzeniu bardzo poważnych badań
        stwierdzono, że lubię Cię zdecydowanie
        za bardzo! ❤️
    </p>

    <h2>A Ty mnie lubisz? 👀</h2>

    <div class="buttons">
        <button id="yes">TAK ❤️</button>
        <button id="no">NIE 😐</button>
    </div>

    <div id="result"></div>
</div>

<script>
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const result = document.getElementById("result");

function uciekaj() {
    let x = Math.random() * 200 - 100;
    let y = Math.random() * 120 - 60;
    no.style.transform = `translate(${x}px, ${y}px)`;
    no.innerText = "Nie klikniesz 😂";
}

no.addEventListener("mouseenter", uciekaj);
no.addEventListener("touchstart", function(e) {
    e.preventDefault();
    uciekaj();
});
no.addEventListener("click", uciekaj);

yes.addEventListener("click", function() {
    result.innerHTML =
        "WIEDZIAŁEM PYSIU MYSIU 😎❤️<br>Teraz już nie ma odwrotu 😂💕";

    for(let i = 0; i < 50; i++) {
        setTimeout(serduszko, i * 50);
    }
});

function serduszko() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 30) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}

setInterval(serduszko, 900);
</script>

</body>
</html>
